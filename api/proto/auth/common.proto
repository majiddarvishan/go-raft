syntax = "proto3";
package auth;
option go_package = "authenticator/api/proto/auth;auth";

enum BindType {
  BIND_TYPE_UNKNOWN     = 0;
  BIND_TYPE_RECEIVER    = 1;
  BIND_TYPE_TRANSMITTER = 2;
  BIND_TYPE_TRANSCEIVER = 9;
}

enum ErrorCode {
  ERROR_CODE_NONE    = 0;
  ERROR_CODE_SUCCESS = 1;

  ERROR_CODE_INTERNAL          = 100;
  ERROR_CODE_SERVICE_UNAVAILABLE = 103;

  ERROR_CODE_MISSING_REQUESTER_ID = 600;
  ERROR_CODE_MISSING_SYSTEM_ID    = 601;
  ERROR_CODE_INVALID_SOURCE_IP    = 604;
  ERROR_CODE_INVALID_BIND_TYPE    = 605;

  ERROR_CODE_MAX_CONNECTIONS_REACHED   = 400;
  ERROR_CODE_CONNECTION_NOT_FOUND      = 500;
  ERROR_CODE_CONNECTION_ALREADY_CLOSED = 501;
  ERROR_CODE_INVALID_CONNECTION_ID     = 503;

  ERROR_CODE_CONFIG_NOT_FOUND    = 700;
  ERROR_CODE_CONFIG_INCONSISTENT = 701;

  ERROR_CODE_NOT_LEADER          = 900;
  ERROR_CODE_LEADER_UNKNOWN      = 901;
  ERROR_CODE_CLUSTER_UNAVAILABLE = 902;
  ERROR_CODE_RAFT_APPLY_FAILED   = 903;
  ERROR_CODE_NODE_ALREADY_EXISTS = 904;
  ERROR_CODE_NODE_NOT_FOUND      = 905;
}
